<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD DE CONTROL DE PRUEBAS DE I+D</title>
  
  <!-- Tipografía Inter e Iconos FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
    }

    /* BARRA SUPERIOR */
    .header-bar {
      height: 60px;
      background: linear-gradient(90deg, #1E293B 0%, #0F172A 100%);
      border-bottom: 1px solid #334155;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 36px;
      height: 36px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #3B82F6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60A5FA;
      font-size: 1.1rem;
    }

    .title-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .title-text .update-tag {
      font-size: 0.72rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* NAVEGACIÓN Y SELECTOR DE HOJAS */
    .nav-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-selector {
      background: #1E293B;
      border: 1px solid #3B82F6;
      color: #F8FAFC;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* BOTONES DE ACCIÓN */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: #1E293B;
      border: 1px solid #475569;
      color: #FFFFFF;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #334155;
    }

    .btn-primary {
      background: #2563EB;
      border-color: #3B82F6;
    }

    .btn-primary:hover {
      background: #1D4ED8;
    }

    /* CONTENEDOR DEL POWER BI */
    .viewport-container {
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background-color: #0F172A;
    }

    .viewport-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* MODAL DE EXPORTACIÓN A PDF */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 480px;
      max-width: 90%;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #94A3B8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.85rem;
      outline: none;
    }

    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0F172A;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      max-height: 150px;
      overflow-y: auto;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: #E2E8F0;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="header-bar">
    
    <div class="title-group">
      <div class="title-icon">
        <i class="fa-solid fa-flask-vial"></i>
      </div>
      <div class="title-text">
        <h1>Dashboard de Control de Pruebas de I+D</h1>
        <div class="update-tag">
          <i class="fa-regular fa-clock"></i>
          <span>Última actualización: <strong>12/08/2026 - 14:50 hrs</strong></span>
        </div>
      </div>
    </div>

    <!-- SELECTOR NAVEGADOR DE HOJAS REAL -->
    <div class="nav-group">
      <label for="sheetSelect" style="font-size: 0.8rem; color: #94A3B8; font-weight: 600;">Sección:</label>
      <select class="sheet-selector" id="sheetSelect" onchange="navigateToSheet(this.value)">
        <option value="CONSUMO" selected>📄 CONSUMO</option>
        <option value="RESULTADOS">📄 RESULTADOS</option>
        <option value="ARENA_PIEDRA">📄 ARENA_PIEDRA</option>
      </select>
    </div>

    <!-- ACCIONES -->
    <div class="actions-group">
      <button class="btn-action" onclick="openExportModal()">
        <i class="fa-solid fa-file-pdf" style="color: #F87171;"></i> Exportar a PDF
      </button>

      <button class="btn-action btn-primary" onclick="maximizeView()">
        <i class="fa-solid fa-expand"></i> Ampliar Vista
      </button>
    </div>

  </header>

  <!-- VISOR POWER BI -->
  <main class="viewport-container" id="powerbiContainer">
    <iframe 
      id="powerbiFrame"
      title="RR_ACTUALIZADO" 
      src="https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299&pageName=ReportSection" 
      allow="fullscreen"
      allowFullScreen="true">
    </iframe>
  </main>

  <!-- MODAL PARA EXPORTAR A PDF SELECCIONANDO GRAFICOS Y TÍTULO -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal-card">
      <h2><i class="fa-solid fa-file-pdf" style="color: #EF4444;"></i> Configurar Exportación a PDF</h2>
      
      <div class="form-group">
        <label for="pdfTitle">Título del Reporte PDF:</label>
        <input type="text" id="pdfTitle" value="Reporte de Ensayos I+D - Control de Pruebas">
      </div>

      <div class="form-group">
        <label>Selecciona las gráficas / secciones a incluir:</label>
        <div class="checkbox-list">
          <label class="checkbox-item">
            <input type="checkbox" checked> Consumo de Cemento y Adición
          </label>
          <label class="checkbox-item">
            <input type="checkbox" checked> Consumo de Agua y Aditivos
          </label>
          <label class="checkbox-item">
            <input type="checkbox" checked> Consumo de Piedra y Arena
          </label>
          <label class="checkbox-item">
            <input type="checkbox" checked> Gráfica de Costos (S/.)
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-action" onclick="closeExportModal()">Cancelar</button>
        <button class="btn-action btn-primary" onclick="triggerPrint()">
          <i class="fa-solid fa-download"></i> Generar Documento
        </button>
      </div>
    </div>
  </div>

  <script>
    // URL base de tu reporte
    const baseUrl = "https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299";

    // Mapeo de secciones para cambiar de página de forma real
    const pageMap = {
      "CONSUMO": "ReportSection",
      "RESULTADOS": "ReportSection1",
      "ARENA_PIEDRA": "ReportSection2"
    };

    function navigateToSheet(sheetName) {
      const frame = document.getElementById('powerbiFrame');
      const section = pageMap[sheetName] || "ReportSection";
      frame.src = `${baseUrl}&pageName=${section}`;
    }

    // Modal Exportación PDF
    function openExportModal() {
      document.getElementById('exportModal').style.display = 'flex';
    }

    function closeExportModal() {
      document.getElementById('exportModal').style.display = 'none';
    }

    function triggerPrint() {
      closeExportModal();
      window.print(); // Abre el diálogo nativo para guardar como PDF
    }

    // Pantalla Completa
    function maximizeView() {
      const container = document.getElementById('powerbiContainer');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>
