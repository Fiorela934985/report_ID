<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD DE CONTROL DE PRUEBAS DE I+D</title>
  
  <!-- Tipografía Inter e Iconos FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
    }

    /* BARRA SUPERIOR */
    .header-bar {
      height: 60px;
      background: linear-gradient(90deg, #1E293B 0%, #0F172A 100%);
      border-bottom: 1px solid #334155;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 100;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 36px;
      height: 36px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #3B82F6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60A5FA;
      font-size: 1.1rem;
    }

    .title-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .title-text .update-tag {
      font-size: 0.72rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* BOTONES DE ACCIÓN */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: #1E293B;
      border: 1px solid #475569;
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #334155;
    }

    .btn-primary {
      background: #2563EB;
      border-color: #3B82F6;
    }

    .btn-primary:hover {
      background: #1D4ED8;
    }

    /* CONTENEDOR DEL POWER BI CON ZOOM AL 110% */
    .viewport-container {
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background-color: #0F172A;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewport-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;

      /* APLICAR ACERCAMIENTO / ZOOM AL 110% */
      transform: scale(1.1);
      transform-origin: center center;
    }

    /* ESTILOS PARA LA IMPRESIÓN / DESCARGA A PDF */
    @media print {
      .header-bar {
        display: none !important; /* Oculta la barra superior al exportar a PDF */
      }
      .viewport-container {
        height: 100vh !important;
      }
      .viewport-container iframe {
        transform: scale(1) !important; /* Mantiene escala normal en PDF */
      }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="header-bar">
    
    <div class="title-group">
      <div class="title-icon">
        <i class="fa-solid fa-flask-vial"></i>
      </div>
      <div class="title-text">
        <h1>Dashboard de Control de Pruebas de I+D</h1>
        <div class="update-tag">
          <i class="fa-regular fa-clock"></i>
          <span>Última actualización: <strong id="lastUpdateText">--/--/---- --:-- hrs</strong></span>
        </div>
      </div>
    </div>

    <!-- ACCIONES: DESCARGAR PDF Y AMPLIAR VISTA -->
    <div class="actions-group">
      <button class="btn-action" onclick="downloadPDF()">
        <i class="fa-solid fa-file-pdf" style="color: #F87171;"></i> Descargar PDF
      </button>

      <button class="btn-action btn-primary" onclick="maximizeView()">
        <i class="fa-solid fa-expand"></i> Ampliar Vista
      </button>
    </div>

  </header>

  <!-- VISOR POWER BI (INICIA EN RESULTADOS CON ZOOM 110%) -->
  <main class="viewport-container" id="powerbiContainer">
    <iframe 
      id="powerbiFrame"
      title="RR_ACTUALIZADO" 
      src="https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299&pageName=ReportSection1" 
      allow="fullscreen"
      allowFullScreen="true">
    </iframe>
  </main>

  <script>
    // 1. Genera automáticamente la fecha y hora de la última actualización
    function setLiveTimestamp() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      const formattedString = `${day}/${month}/${year} - ${hours}:${minutes} hrs`;
      document.getElementById('lastUpdateText').innerText = formattedString;
    }

    // 2. Función para descargar la página actual en PDF
    function downloadPDF() {
      window.print();
    }

    // 3. Función para Pantalla Completa
    function maximizeView() {
      const container = document.getElementById('powerbiContainer');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Ejecuta la fecha al cargar la página
    window.onload = setLiveTimestamp;
  </script>

</body>
</html>
