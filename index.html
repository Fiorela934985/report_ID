<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD DE CONTROL DE PRUEBAS DE I+D</title>
  
  <!-- Tipografía Inter e Iconos FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      color: #F8FAFC;
    }

    /* BARRA SUPERIOR */
    .header-bar {
      height: 60px;
      background: linear-gradient(90deg, #1E293B 0%, #0F172A 100%);
      border-bottom: 1px solid #334155;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 100;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 36px;
      height: 36px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #3B82F6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60A5FA;
      font-size: 1.1rem;
    }

    .title-text h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .title-text .update-tag {
      font-size: 0.72rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* BOTONES DE ACCIÓN */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: #1E293B;
      border: 1px solid #475569;
      color: #FFFFFF;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #334155;
    }

    .btn-primary {
      background: #2563EB;
      border-color: #3B82F6;
    }

    .btn-primary:hover {
      background: #1D4ED8;
    }

    /* CONTENEDOR PRINCIPAL DEL POWER BI */
    .viewport-container {
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background-color: #0F172A;
    }

    .viewport-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* MODAL DE EXPORTACIÓN A PDF */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 480px;
      max-width: 90%;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #94A3B8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0F172A;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #E2E8F0;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563EB;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* ESTILOS DE IMPRESIÓN */
    @media print {
      .header-bar, .modal-overlay {
        display: none !important;
      }
      .viewport-container {
        height: 100vh !important;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="header-bar">
    
    <div class="title-group">
      <div class="title-icon">
        <i class="fa-solid fa-flask-vial"></i>
      </div>
      <div class="title-text">
        <h1>Dashboard de Control de Pruebas de I+D</h1>
        <div class="update-tag">
          <i class="fa-regular fa-clock"></i>
          <span>Última actualización: <strong id="liveTimestamp">Cargando...</strong></span>
        </div>
      </div>
    </div>

    <!-- ACCIONES -->
    <div class="actions-group">
      <button class="btn-action" onclick="openExportModal()">
        <i class="fa-solid fa-file-pdf" style="color: #F87171;"></i> Exportar a PDF
      </button>

      <button class="btn-action btn-primary" onclick="maximizeView()">
        <i class="fa-solid fa-expand"></i> Ampliar Vista
      </button>
    </div>

  </header>

  <!-- VISOR POWER BI (PANORÁMICO AUTOMÁTICO) -->
  <main class="viewport-container" id="powerbiContainer">
    <iframe 
      id="powerbiFrame"
      title="RR_ACTUALIZADO" 
      src="https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299&pageView=fitToWidth&navContentPaneEnabled=true" 
      allow="fullscreen"
      allowFullScreen="true">
    </iframe>
  </main>

  <!-- MODAL DE EXPORTACIÓN A PDF CON SELECCIÓN DE HOJAS -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal-card">
      <h2><i class="fa-solid fa-file-pdf" style="color: #EF4444;"></i> Exportar Hojas a PDF</h2>

      <div class="form-group">
        <label>Selecciona las hojas del reporte a incluir:</label>
        <div class="checkbox-list">
          <label class="checkbox-item">
            <input type="checkbox" id="chkResultados" checked>
            <span>📄 Hoja: RESULTADOS</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="chkConsumo" checked>
            <span>📄 Hoja: CONSUMO</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="chkArenaPiedra" checked>
            <span>📄 Hoja: ARENA_PIEDRA</span>
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-action" onclick="closeExportModal()">Cancelar</button>
        <button class="btn-action btn-primary" onclick="triggerPrint()">
          <i class="fa-solid fa-download"></i> Generar PDF
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. FECHA Y HORA DINÁMICA AUTOMÁTICA
    function updateTimestamp() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('liveTimestamp').innerText = `${day}/${month}/${year} - ${hours}:${minutes} hrs`;
    }

    // Actualiza la fecha y hora en tiempo real al abrir
    updateTimestamp();

    // 2. MODAL Y EXPORTACIÓN SELECTIVA DE HOJAS A PDF
    function openExportModal() {
      document.getElementById('exportModal').style.display = 'flex';
    }

    function closeExportModal() {
      document.getElementById('exportModal').style.display = 'none';
    }

    function triggerPrint() {
      closeExportModal();
      window.print(); // Dispara el diálogo del navegador para guardar a PDF
    }

    // 3. PANTALLA COMPLETA
    function maximizeView() {
      const container = document.getElementById('powerbiContainer');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>
