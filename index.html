<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD DE CONTROL DE PRUEBAS DE I+D</title>
  
  <!-- Tipografía Inter e Iconos FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Elimina barras de desplazamiento externas */
      background-color: #0F172A;
      color: #F8FAFC;
    }

    /* BARRA SUPERIOR COMPACTA Y FUNCIONAL */
    .header-bar {
      height: 60px;
      background: linear-gradient(90deg, #1E293B 0%, #0F172A 100%);
      border-bottom: 1px solid #334155;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }

    /* SECCIÓN TÍTULO */
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 36px;
      height: 36px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #3B82F6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60A5FA;
      font-size: 1.1rem;
    }

    .title-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .title-text .update-tag {
      font-size: 0.73rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .update-tag i {
      color: #38BDF8;
    }

    /* SECCIÓN DE NAVEGACIÓN Y SELECTOR DE HOJAS */
    .nav-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .view-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .view-badge strong {
      color: #38BDF8;
      font-weight: 600;
    }

    /* COMBO BOX DE HOJAS DEL REPORTE */
    .sheet-selector {
      background: #1E293B;
      border: 1px solid #3B82F6;
      color: #F8FAFC;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sheet-selector:hover {
      background: #334155;
    }

    /* ACCIONES */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-expand {
      background: #2563EB;
      border: 1px solid #3B82F6;
      color: #FFFFFF;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-expand:hover {
      background: #1D4ED8;
    }

    /* ÁREA PRINCIPAL PROTAGONISTA (POWER BI) */
    .viewport-container {
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background-color: #0F172A;
    }

    .viewport-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO DE CONTROL -->
  <header class="header-bar">
    
    <!-- Título de la Aplicación -->
    <div class="title-group">
      <div class="title-icon">
        <i class="fa-solid fa-vial-circle-check"></i>
      </div>
      <div class="title-text">
        <h1>Dashboard de Control de Pruebas de I+D</h1>
        <div class="update-tag">
          <i class="fa-regular fa-clock"></i>
          <span>Última actualización: <strong>12/08/2026 - 14:50 hrs</strong></span>
        </div>
      </div>
    </div>

    <!-- Selector de Hojas + Indicador de Vista -->
    <div class="nav-group">
      <div class="view-badge">
        <span>Vista Activa:</span>
        <strong id="activeViewLabel">CONSUMO</strong>
      </div>

      <!-- Combo Box para seleccionar hojas detectadas -->
      <select class="sheet-selector" id="sheetSelect" onchange="changeSheet(this.value)">
        <option value="CONSUMO" selected>📄 Ir a: CONSUMO</option>
        <option value="RESULTADOS">📄 Ir a: RESULTADOS</option>
        <option value="ARENA_PIEDRA">📄 Ir a: ARENA_PIEDRA</option>
      </select>
    </div>

    <!-- Botón Ampliar Vista -->
    <div class="actions-group">
      <button class="btn-expand" onclick="maximizeView()">
        <i class="fa-solid fa-expand"></i> Ampliar Vista
      </button>
    </div>

  </header>

  <!-- CONTENEDOR DEL POWER BI EN TAMAÑO MÁXIMO -->
  <main class="viewport-container" id="powerbiContainer">
    <iframe 
      id="powerbiFrame"
      title="RR_ACTUALIZADO" 
      src="https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299&pageName=ReportSection" 
      allow="fullscreen"
      allowFullScreen="true">
    </iframe>
  </main>

  <script>
    // Actualiza la etiqueta cuando cambias de hoja en el Combo Box
    function changeSheet(selectedSheet) {
      document.getElementById('activeViewLabel').innerText = selectedSheet;
    }

    // Ampliar vista a Pantalla Completa
    function maximizeView() {
      const container = document.getElementById('powerbiContainer');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        } else if (container.msRequestFullscreen) {
          container.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>
