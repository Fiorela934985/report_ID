<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte I+D - Power BI</title>
  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    /* Tarjeta contenedor */
    .report-card {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .report-header {
      padding: 20px 24px;
      border-bottom: 1px solid #e0e0e0;
      background-color: #ffffff;
    }

    .report-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111827;
    }

    /* Contenedor adaptativo (mantiene la relación de aspecto) */
    .iframe-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Relación de aspecto 16:9 */
      background-color: #fafafa;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <main class="report-card">
    <header class="report-header">
      <h1>Reporte de Investigación y Desarrollo (I+D)</h1>
    </header>
    
    <div class="iframe-container">
      <iframe 
        title="RR_ACTUALIZADO" 
        src="https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299&actionBarEnabled=true" 
        allow="fullscreen"
        loading="lazy">
      </iframe>
    </div>
  </main>

</body>
</html>
