<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Control & Analítica - Power BI</title>
  
  <!-- Fuental Google Inter & Iconos FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* RESET & ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
      background-color: #0F172A; /* Fondo oscuro moderno para resaltar el reporte */
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden; /* Evita doble scroll */
    }

    /* BARRA SUPERIOR (HEADER INTEGRADO) */
    .top-bar {
      background: linear-gradient(90deg, #1E293B 0%, #0F172A 100%);
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 10;
    }

    /* TÍTULO Y BADGE */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #3B82F6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60A5FA;
      font-size: 1.2rem;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #FFFFFF;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #94A3B8;
    }

    /* TARJETAS METRICAS RESUMEN (KPI TOP BAR) */
    .kpi-container {
      display: flex;
      gap: 16px;
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 120px;
    }

    .kpi-card .kpi-label {
      font-size: 0.7rem;
      color: #94A3B8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .kpi-card .kpi-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #38BDF8;
    }

    /* BOTONES DE ACCIÓN Y ESTADO */
    .actions-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ADE80;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-pill .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #22C55E;
      border-radius: 50%;
      box-shadow: 0 0 8px #22C55E;
    }

    .btn-action {
      background: #1E293B;
      border: 1px solid #475569;
      color: #F8FAFC;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: #334155;
      border-color: #64748B;
    }

    .btn-primary {
      background: #2563EB;
      border-color: #3B82F6;
    }

    .btn-primary:hover {
      background: #1D4ED8;
    }

    /* CONTENEDOR PRINCIPAL DEL POWER BI (MÁXIMO TAMAÑO) */
    .dashboard-viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 67px); /* Ocupa todo el resto de la pantalla */
      position: relative;
      background-color: #0F172A;
    }

    .dashboard-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* OCULTAR KPIS EN PANTALLAS PEQUEÑAS */
    @media (max-width: 900px) {
      .kpi-container {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR DE CONTROL -->
  <header class="top-bar">
    
    <!-- Título / Logotipo -->
    <div class="brand-section">
      <div class="brand-icon">
        <i class="fa-solid fa-flask-vial"></i>
      </div>
      <div class="brand-text">
        <h1>Centro de Monitoreo de Ensayos & Consumos</h1>
        <p>Control Estratégico de Diseños de Mezcla</p>
      </div>
    </div>

    <!-- Indicadores Rápidos (KPIs Complementarios) -->
    <div class="kpi-container">
      <div class="kpi-card">
        <span class="kpi-label">Estado</span>
        <span class="kpi-val">Optimizado</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Vista Actual</span>
        <span class="kpi-val">Consumo & Costos</span>
      </div>
    </div>

    <!-- Acciones / Pantalla Completa -->
    <div class="actions-section">
      <div class="status-pill">
        <span class="pulse-dot"></span>
        <span>Datos Actualizados</span>
      </div>
      
      <button class="btn-action btn-primary" onclick="maximizeReport()">
        <i class="fa-solid fa-expand"></i> Ampliar Vista
      </button>
    </div>

  </header>

  <!-- ÁREA PROTAGONISTA DEL DASHBOARD -->
  <main class="dashboard-viewport" id="reportContainer">
    <iframe 
      id="powerbiFrame"
      title="RR_ACTUALIZADO" 
      src="https://app.powerbi.com/reportEmbed?reportId=f069fa6a-322d-4941-8cff-d903458133b4&autoAuth=true&ctid=3e4a937b-236b-483a-8179-3792d2dfe299&actionBarEnabled=true" 
      allow="fullscreen"
      allowFullScreen="true"
      loading="eager">
    </iframe>
  </main>

  <script>
    // Maximiza el contenedor a pantalla completa
    function maximizeReport() {
      const container = document.getElementById('reportContainer');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        } else if (container.msRequestFullscreen) {
          container.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>
